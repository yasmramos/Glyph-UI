name: Maven CI

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Install system dependencies for GLFW/OpenGL
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          xvfb \
          libgl1 \
          libgl1-mesa-dri \
          libglu1-mesa \
          libxrandr2 \
          libxcursor1 \
          libxi6 \
          libxinerama1 \
          libxxf86vm1 \
          libglfw3 \
          libglfw3-dev

    - name: Ensure screenshots directory exists
      run: mkdir -p screenshots

    - name: Run tests with Xvfb (virtual display)
      env:
        LIBGL_ALWAYS_SOFTWARE: "1"
        DISPLAY: ":99"
      run: |
        echo "Starting Xvfb..."
        Xvfb :99 -screen 0 1280x1024x24 &
        sleep 2
        echo "Running Maven tests..."
        mvn -B test
        echo "Tests completed. Checking for screenshots..."
        ls -la screenshots/ || echo "No screenshots directory found"
        find . -name "*.png" -type f || echo "No PNG files found"

    - name: Upload screenshot artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: screenshots
        path: screenshots/*.png
        retention-days: 7
        if-no-files-found: warn
