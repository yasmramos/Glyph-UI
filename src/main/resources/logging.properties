# Opt-in java.util.logging configuration for the toolkit's System.Logger
# output. It is NOT picked up automatically; enable it with:
#   -Djava.util.logging.config.file=src/main/resources/logging.properties
handlers=java.util.logging.ConsoleHandler
.level=INFO

java.util.logging.ConsoleHandler.level=ALL
java.util.logging.ConsoleHandler.formatter=io.github.yasmramos.glyphui.core.logging.SLF4JStyleFormatter

java.util.logging.FileHandler.level=ALL
java.util.logging.FileHandler.formatter=io.github.yasmramos.glyphui.core.logging.SLF4JStyleFormatter
